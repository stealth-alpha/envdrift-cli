name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run tests
        run: npm test

      - name: Self-check (dogfood)
        run: |
          npm install --global .
          envdrift check --dir demo/app --format json > /dev/null || true
          node -e "console.log('dogfood ok')"
